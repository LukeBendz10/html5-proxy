<!-- Paste this into Google Sites: Insert > Embed > "Embed code" tab -->
<!-- Change PROXY below to your hosted server's HTTPS address (no trailing slash) -->
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  form { display: flex; gap: 8px; padding: 8px; background: #1e293b; }
  input { flex: 1; padding: 8px 12px; border: 0; border-radius: 6px; font-size: 14px; }
  button { padding: 8px 16px; border: 0; border-radius: 6px; background: #22c55e; color: #fff; font-weight: 600; cursor: pointer; }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
</style>

<form id="f">
  <input id="u" type="text" placeholder="Enter a URL, e.g. example.com">
  <button>Go</button>
</form>
<iframe id="view" title="Proxied page"></iframe>

<script>
  var PROXY = 'https://YOUR-APP.example.com';
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var url = document.getElementById('u').value.trim();
    if (!url) return;
    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
    document.getElementById('view').src = PROXY + '/proxy?url=' + encodeURIComponent(url);
  });
</script>
